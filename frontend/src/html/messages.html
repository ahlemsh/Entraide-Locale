<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Entraide</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-text">Entraide</span>
      </div>
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="requests.html" class="nav-link">Demandes</a>
        <a href="offers.html" class="nav-link">Offres</a>
        <a href="messages.html" class="nav-link active">Messages</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="profile.html" class="nav-link">Profil</a>
        <a href="admin-requests.html" class="nav-link" style="color: #e74c3c;">Admin</a>
      </nav>
      <!-- Add auth menu -->
      <div id="authMenu" class="auth-menu"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="messages-container">
      <!-- Conversations List -->
      <aside class="conversations-list">
        <h3>Conversations</h3>
        <div class="start-conv">
          <input id="startConvQuery" type="text" placeholder="Chercher un membre" class="form-input" style="margin-bottom:8px;">
          <button class="btn btn-primary btn-sm" style="width:100%;" onclick="searchUsersForChat()">Rechercher</button>
          <div id="startConvResults" class="start-conv-results"></div>
        </div>
        <div id="conversationsContainer">
          <!-- Dynamically loaded by app.js -->
        </div>
      </aside>

      <!-- Messages View -->
      <section class="messages-view">
        <div id="messagesContent">
          <p class="empty-state">Sélectionnez une conversation pour commencer</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Entraide. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderAuthMenu();
      requireAuth();
      loadConversations();
    });
  </script>
</body>
</html>
