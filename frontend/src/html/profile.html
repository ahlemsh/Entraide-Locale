<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - EntreAide</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navigation Header -->
  <header class="header">
    <div class="header-container">
      <div class="logo">
        <span class="logo-text">EntreAide</span>
      </div>
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="requests.html" class="nav-link">Demandes</a>
        <a href="offers.html" class="nav-link">Offres</a>
        <a href="messages.html" class="nav-link">Messages</a>
        <a href="profile.html" class="nav-link active">Profil</a>
        <a href="admin-requests.html" class="nav-link" style="color: #e74c3c;">Admin</a>
      </nav>
      <!-- Add auth menu -->
      <div id="authMenu" class="auth-menu"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container page-container">
      <div id="profileContainer">
        <!-- Dynamically loaded by app.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 EntreAide. Tous droits réservés.</p>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      renderAuthMenu();
      initializeAuth();
      if (!requireAuth()) return;

      const params = new URLSearchParams(window.location.search);
      const viewedUserId = params.get('userId');

      if (viewedUserId) {
        // Si un userId est passé dans l'URL → on affiche le profil de cette personne
        loadPublicProfile(parseInt(viewedUserId, 10));
      } else {
        // Sinon → on affiche le profil de l'utilisateur connecté (Alice)
        loadProfile();
      }
    });
  </script>
  </body>
  
  </html>
