<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - EntreAide</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="logo"><span class="logo-text">EntreAide</span></div>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Accueil</a></li>
        <li><a href="login.html" class="nav-link">Connexion</a></li>
      </ul>
    </div>
  </header>

  <div class="main-content">
    <div class="container form-page">
      <div class="form-header">
        <h2>Créer un Compte</h2>
        <p>Rejoignez notre communauté d'entraide</p>
      </div>

      <div class="form-container">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">Prénom *</label>
              <input type="text" id="firstName" name="firstName" class="form-input" required>
            </div>
            <div class="form-group">
              <label for="lastName">Nom *</label>
              <input type="text" id="lastName" name="lastName" class="form-input" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" class="form-input" required>
          </div>

          <div class="form-group">
            <label for="password">Mot de passe *</label>
            <input type="password" id="password" name="password" class="form-input" required minlength="6">
            <small style="color: #999; margin-top: 4px; display: block;">Minimum 6 caractères</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmer le mot de passe *</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required minlength="6">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Téléphone</label>
              <input type="tel" id="phone" name="phone" class="form-input">
            </div>
            <div class="form-group">
              <label for="quartier">Quartier *</label>
              <select id="quartier" name="quartier" class="form-input" required>
                <option value="">Sélectionnez un quartier</option>
                <option value="Centre">Centre</option>
                <option value="Nord">Nord</option>
                <option value="Sud">Sud</option>
                <option value="Est">Est</option>
                <option value="Ouest">Ouest</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" class="form-textarea" placeholder="Parlez un peu de vous..."></textarea>
          </div>

          <div class="form-group" style="display: flex; gap: 12px; align-items: center;">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms" style="margin: 0;">J'accepte les <a href="#" style="color: var(--primary); text-decoration: none;">conditions d'utilisation</a> *</label>
          </div>

          <div id="errorMessage" style="color: var(--danger); margin-bottom: 16px; display: none;"></div>

          <div class="form-actions" style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Créer un compte</button>
            <button type="reset" class="btn btn-secondary" style="flex: 1; background-color: #999;">Annuler</button>
          </div>

          <p style="text-align: center; margin-top: 16px; color: #666;">
            Vous avez déjà un compte? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Se connecter</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 EntreAide - Plateforme d'entraide communautaire</p>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    function handleRegister(event) {
      event.preventDefault();
      
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const phone = document.getElementById('phone').value;
      const quartier = document.getElementById('quartier').value;
      const bio = document.getElementById('bio').value;
      const errorMessage = document.getElementById('errorMessage');

      // Validation
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Les mots de passe ne correspondent pas';
        errorMessage.style.display = 'block';
        return;
      }

      const userData = {
        firstName,
        lastName,
        email,
        password,
        phone,
        quartier,
        bio,
      };

      // Replace with your actual backend URL
      const backendUrl = process.env.REACT_APP_API_URL || 'http://localhost:3000/api';
      
      fetch(`${backendUrl}/auth/register`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(userData),
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erreur lors de l\'inscription');
        }
        return response.json();
      })
      .then(data => {
        console.log('[v0] Registration successful:', data);
        localStorage.setItem('userId', data.userId);
        localStorage.setItem('userToken', data.token);
        alert('Inscription réussie! Redirection...');
        window.location.href = 'index.html';
      })
      .catch(error => {
        console.error('[v0] Registration error:', error);
        errorMessage.textContent = error.message || 'Erreur lors de l\'inscription';
        errorMessage.style.display = 'block';
      });
    }
  </script>
</body>
</html>
